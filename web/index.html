<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원신 데미지 계산기 — PoC</title>
<style>
  :root { color-scheme: light dark; --line:#8883; --dim:#8888; --warn:#c80; --err:#c33; }
  body { font-family: system-ui, "Malgun Gothic", sans-serif; margin:0; padding:1.5rem;
         max-width:1400px; margin-inline:auto; line-height:1.5; }
  h1 { font-size:1.25rem; margin:0 0 .25rem; }
  h2 { font-size:1rem; margin:1.5rem 0 .5rem; padding-bottom:.25rem; border-bottom:1px solid var(--line); }
  .sub { color:var(--dim); font-size:.85rem; font-weight:400; }
  #status { padding:.6rem .8rem; border:1px solid var(--line); border-radius:6px;
            margin-bottom:1rem; font-size:.9rem; white-space:pre-wrap; }
  #status.err { border-color:var(--err); color:var(--err); }
  #errors:not(:empty) { padding:.6rem .8rem; border:1px solid var(--err); color:var(--err);
                        border-radius:6px; margin-bottom:1rem; font-size:.88rem; }
  button { font:inherit; padding:.3rem .8rem; border:1px solid var(--line); border-radius:6px;
           background:transparent; color:inherit; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.mini { padding:.1rem .45rem; font-size:.8rem; }
  select, input, textarea { font:inherit; padding:.2rem; background:transparent; color:inherit;
                  border:1px solid var(--line); border-radius:4px; }
  input[type=number] { width:5.5rem; }

  table { border-collapse:collapse; width:100%; font-size:.88rem; }
  th,td { text-align:right; padding:.3rem .5rem; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { font-weight:600; color:var(--dim); }
  td.num { font-variant-numeric:tabular-nums; }

  .cols { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; align-items:start; }
  @media (max-width:1000px) { .cols { grid-template-columns:1fr; } }
  .scroll { max-height:75vh; overflow:auto; }

  /* 탭 — 왼쪽 칸에서 파티와 상황 질문이 자리를 나눠 쓴다 */
  .tabs { display:flex; gap:.25rem; margin:1.5rem 0 .5rem; border-bottom:1px solid var(--line); }
  /* 세로 여백은 h2 의 padding-bottom(.25rem)에 맞춰 잡는다 — 탭 줄과 오른쪽 칸의
     제목이 같은 높이에서 시작해야 두 칸이 한 줄로 읽힌다. */
  .tabs button { font:inherit; font-size:1rem; font-weight:600; color:var(--dim);
                 padding:.2rem .7rem; margin-bottom:-1px; cursor:pointer;
                 background:transparent; border:1px solid transparent; border-bottom:none;
                 border-radius:6px 6px 0 0; }
  .tabs button:hover { color:inherit; }
  /* 고른 탭은 아래 테두리를 지워 패널과 한 몸으로 이어 붙인다 */
  .tabs button[aria-selected="true"] { color:inherit; border-color:var(--line); background:Canvas; }
  .tabs button .sub { font-weight:400; }
  .tabpanel[hidden] { display:none; }
  #qinfo { margin-bottom:.5rem; }

  /* 파티 편성 — 카드를 세로로 쌓는다. 카드는 고정 폭 없이 탭 패널을 100% 채운다. */
  #party { display:grid; gap:.5rem; container-type:inline-size; }
  #party .slot { border:1px solid var(--line); border-radius:6px; padding:.4rem .6rem;
                 font-size:.88rem; display:flex; flex-direction:column; gap:.3rem;
                 justify-content:center; }

  /* ── 빌드 카드 ──────────────────────────────────────────────────────────
     디자인 원본: Genshin Card Design/design_handoff_build_card/ (시안 1a「3행·밀집형」).
     한 캐릭터가 **무엇을 끼웠는가**만 보여준다 — 계산된 스탯과 성유물 주/부옵션은
     여기 넣지 않는다. 그건 빌드 편집 창과 스탯 표의 몫이다.
     --ec(원소색)는 카드마다 app.js가 인라인으로 꽂는다. */
  .bc { /* 치수 배율. 디자인의 1× 는 폭 380px 기준이라, 칸이 그보다 넓으면 그 비율만큼
           같이 커진다(글자·아이콘·여백이 한 덩이로 움직여 모양이 안 흐트러진다).
           칸이 380px 이하로 좁아지면 1px 에서 멈춘다 — 거기가 디자인의 1× 다. */
        --u:clamp(1px, 100cqi / 380, 1.8px);
        --bc-bg:light-dark(#fdfdfd,#191c1f); --bc-bg-hover:light-dark(#f4f5f6,#212529);
        --bc-text:light-dark(#1b1c1e,#e7e8ea); --bc-dim:light-dark(#3a3b3d,#c9cacc);
        --bc-muted:#8a8a8a;
        --bc-border:light-dark(#00000020,#ffffff1f);
        --bc-border-strong:light-dark(#00000030,#ffffff33);
        --bc-border-soft:light-dark(#00000018,#ffffff18);
        --bc-hairline:light-dark(#00000012,#ffffff12);
        --bc-chip:light-dark(#00000010,#ffffff14);
        --bc-slot:light-dark(#0000000a,#ffffff10);
        --bc-ring:inset 0 0 0 1px light-dark(#00000014,#ffffff14);
        --bc-ring-empty:inset 0 0 0 1px light-dark(#00000024,#ffffff2b);
        padding:calc(9*var(--u)) calc(10*var(--u)); border:1px solid var(--bc-border);
        border-radius:6px; background:var(--bc-bg); color:var(--bc-text); cursor:pointer;
        transition:background .12s, border-color .12s; }
  .bc:hover { background:var(--bc-bg-hover); border-color:var(--bc-border-strong); }
  .bc:focus-visible { outline:2px solid var(--ec); outline-offset:1px; }
  /* 선택됨 = 데미지 표에 넣기로 「골라 둔」 상태. 색만으로 알리지 않도록 왼쪽 액센트 바가 함께 온다 */
  .bc.on { border-color:var(--ec); box-shadow:inset calc(3*var(--u)) 0 0 var(--ec); }

  .bc .top { display:flex; align-items:flex-start; gap:calc(9*var(--u)); }
  .bc .mid { flex:1; min-width:0; display:flex; flex-direction:column;
             gap:calc(4*var(--u)); padding-top:calc(1*var(--u)); }
  .bc .rowa { display:flex; align-items:center; gap:calc(6*var(--u)); min-width:0; }
  .bc .nm { font-size:calc(13*var(--u)); font-weight:650; letter-spacing:-.01em;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bc .tag { font:calc(10*var(--u))/1 ui-monospace,monospace; flex:none;
             padding:calc(3*var(--u)) calc(4*var(--u)); border-radius:calc(3*var(--u));
             color:var(--ec); background:color-mix(in srgb, var(--ec) 12%, transparent); }
  .bc .con { font:600 calc(10*var(--u))/1 ui-monospace,monospace; flex:none;
             padding:calc(3*var(--u)) calc(4*var(--u)); border-radius:calc(3*var(--u));
             background:var(--bc-chip); color:var(--bc-dim); }
  .bc .rowb { display:flex; align-items:center; gap:calc(8*var(--u)); flex-wrap:wrap;
              font:calc(11*var(--u))/1 ui-monospace,monospace; color:var(--bc-muted); }
  .bc .rowb .lv { color:var(--bc-dim); }
  .bc .tal { display:inline-flex; align-items:baseline; gap:calc(3*var(--u)); }
  .bc .tal .lb { color:var(--bc-muted); }
  .bc .tal b { font:600 calc(11*var(--u))/1 ui-monospace,monospace; color:var(--bc-text); }
  /* 명함으로 오른 특성 — 숫자 자체가 실효 레벨이고 ▲와 점선이 「손으로 올린 값이 아니다」를 말한다 */
  .bc .tal b.up { color:var(--ec); text-decoration:underline dotted;
                  text-underline-offset:calc(3*var(--u)); }
  .bc .act { display:flex; gap:calc(2*var(--u)); flex:none; padding-top:calc(1*var(--u)); }
  .bc .act button { font:calc(10*var(--u))/1 system-ui,sans-serif; border-radius:calc(4*var(--u));
                    padding:calc(4*var(--u)) calc(5*var(--u));
                    border:1px solid var(--bc-border-soft); background:transparent;
                    color:var(--bc-muted); cursor:pointer; }
  .bc .act button:hover { background:light-dark(#00000012,#ffffff18); color:var(--bc-text); }

  .bc .gear { display:flex; align-items:center; gap:calc(7*var(--u));
              padding-top:calc(7*var(--u)); margin-top:calc(1*var(--u));
              border-top:1px solid var(--bc-hairline); }
  .bc .gear .sep { width:1px; height:calc(16*var(--u)); background:var(--bc-border-soft); flex:none; }
  .bc .gear .slots { display:flex; gap:calc(3*var(--u)); flex:none; }
  .bc .gear .cnt,
  .bc .gear .wlv { font:calc(10*var(--u))/1 ui-monospace,monospace; color:var(--bc-muted); flex:none; }
  .bc .gear .sp { flex:1; }

  /* 타일 — 아이콘이 못 와도 자리와 높이가 그대로여야 한다.
     그래서 폴백 글자가 이미지 「뒤에」 늘 깔려 있고, 실패하면 이미지만 투명해진다. */
  .bc .tile { position:relative; display:grid; place-items:center; flex:none;
              overflow:hidden; border-radius:calc(4*var(--u)); box-shadow:var(--bc-ring); }
  .bc .tile.empty { box-shadow:var(--bc-ring-empty); background:transparent; }
  .bc .tile > span { position:absolute; color:var(--bc-muted);
                     font:calc(9*var(--u))/1 ui-monospace,monospace; }
  /* 그림이 온 칸은 폴백 글자를 감춘다 — 아이콘이 투명 PNG라 그냥 두면 뒤에서 비친다.
     지우지 않고 감추기만 하는 이유: 그림이 나중에 실패하면 그대로 다시 드러나야 한다. */
  .bc .tile.has-img > span { visibility:hidden; }
  .bc .tile > img { display:block; width:100%; height:100%; object-fit:cover; position:relative; }
  .bc .av { width:calc(40*var(--u)); height:calc(40*var(--u)); border-radius:calc(5*var(--u));
            background:color-mix(in srgb, var(--ec) 12%, transparent); }
  .bc .av > span { font-size:calc(14*var(--u)); font-weight:600; font-family:inherit; }
  .bc .slot23 { width:calc(23*var(--u)); height:calc(23*var(--u)); background:var(--bc-slot); }
  #opts { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin:.5rem 0; font-size:.88rem; }
  /* 데미지 대상은 칩 여러 개라 이름표 글자와 한 줄로 서야 한다 */
  #opts > .opt { display:flex; gap:.4rem; align-items:center; }

  /* 빌드 편집 창 */
  dialog { padding:0; border:1px solid var(--line); border-radius:10px; color:inherit;
           background:Canvas; width:min(680px, calc(100% - 2rem)); }
  dialog::backdrop { background:#0007; }
  .dlg-hdr { display:flex; justify-content:space-between; align-items:center; gap:1rem;
             padding:.6rem .9rem; border-bottom:1px solid var(--line); font-weight:600; }
  #editorbody { padding:.9rem; max-height:70vh; overflow:auto; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin:.5rem 0; font-size:.85rem; }
  .row label { display:flex; gap:.3rem; align-items:center; }
  .art { border-top:1px solid var(--line); padding-top:.4rem; margin-top:.4rem; }
  .art .hdr { display:flex; gap:.4rem; align-items:center; font-size:.85rem; margin-bottom:.3rem; }
  .art .hdr .name { min-width:3.2rem; color:var(--dim); }
  .subs { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:.25rem; }
  .subs > div { display:flex; gap:.25rem; }
  .subs select { flex:1; min-width:0; }
  .subs input { width:4.5rem; }

  /* 빌드 주고받기 — 저장된 빌드 드롭다운 + JSON. JSON 창은 편집 창 위에 겹쳐 뜬다 */
  .art-share { display:flex; gap:.4rem; align-items:center; margin:.5rem 0 .2rem; font-size:.85rem; }
  .art-share .name { flex:1; color:var(--dim); }
  /* 빌드 이름이 길어도 버튼을 밀어내지 않게 — 줄지언정 넘치지 않는다 */
  .art-share select { flex:0 1 12rem; min-width:0; font-size:.8rem; }
  #sharebody { padding:.9rem; display:flex; flex-direction:column; gap:.6rem; }
  #sharehint { font-size:.82rem; }
  #sharetext { width:100%; box-sizing:border-box; height:18rem; max-height:50vh; resize:vertical;
               font-family:ui-monospace, Consolas, "D2Coding", monospace; font-size:.78rem;
               line-height:1.4; white-space:pre; overflow:auto; }
  #sharemsg:not(:empty) { font-size:.85rem; white-space:pre-wrap; }
  #sharemsg.err { color:var(--err); }
  #sharemsg.ok  { color:var(--dim); }
  #sharebtns { display:flex; gap:.5rem; justify-content:flex-end; }

  /* 데미지 — 캐릭터마다 블록 하나 (히트 표 + 반응 표).
     격변은 계수도 %피해 보너스도 안 타고 반응 치명타가 없으면 비크리=크리라
     열의 의미가 히트와 다르다. 그래서 같은 표에 섞지 않고 소제목으로 나눈다. */
  #damage .dmg-char { font-size:.92rem; font-weight:600; margin:1.1rem 0 .3rem;
                      padding-bottom:.2rem; border-bottom:1px solid var(--line); }
  #damage > .dmg-char:first-child { margin-top:0; }
  #damage .dmg-sub { color:var(--dim); font-size:.82rem; margin:.7rem 0 .2rem; }
  #damage .rx { display:inline-flex; gap:.25rem; flex-wrap:wrap; justify-content:flex-end; }
  #damage .rx button.on { border-color:currentColor; background:#8883; font-weight:600; }

  /* 히트 설명 — 데미지 행을 누르면 열린다 */
  #damage tr.hit { cursor:pointer; }
  #damage tr.hit:hover td { background:#8881; }
  #damage tr.hit:focus-visible { outline:2px solid currentColor; outline-offset:-2px; }
  dialog.wide { width:min(920px, calc(100% - 2rem)); }
  #explainbody { padding:.9rem; max-height:75vh; overflow:auto; font-size:.85rem; }
  .ex-res { font-size:.95rem; font-variant-numeric:tabular-nums; }
  .ex-sec { margin-top:1.1rem; }
  .ex-sec > h3 { font-size:.85rem; font-weight:600; color:var(--dim); margin:0 0 .4rem;
                 padding-bottom:.2rem; border-bottom:1px solid var(--line); }
  .ex-field { margin:.3rem 0; }
  .ex-field .ex-field { margin-left:1.1rem; }   /* 스탯 조립의 base/pct/flat */
  .ex-field .head, .ex-parts div { display:flex; gap:.8rem; font-variant-numeric:tabular-nums; }
  .ex-field .head .nm, .ex-parts .src { flex:1; min-width:0; }
  .ex-field .head .base { color:var(--dim); font-size:.8rem; }
  .ex-parts { margin-left:1.1rem; color:var(--dim); }
  .ex-parts .rest { color:var(--warn); }        /* 원장에 안 잡힌 나머지 */
  .ex-sec .term { color:var(--dim); font-size:.8rem; margin-left:.45rem; }
  .ex-kind { color:var(--dim); font-size:.85rem; }
  /* 격변 설명에서 스탯 조립·보너스 풀이 통째로 접히는 이유를 밝히는 줄 */
  .ex-note { margin-top:.5rem; padding:.4rem .55rem; border-left:2px solid var(--line);
             color:var(--dim); font-size:.8rem; line-height:1.45; }
  /* 이 히트에 안 걸리는 항목 — 지우지 않고 접어 둔다 */
  .ex-off { margin-top:.5rem; }
  .ex-off > summary { cursor:pointer; color:var(--dim); font-size:.8rem; }
  .ex-off[open] > summary { margin-bottom:.35rem; }
  .ex-off .head { color:var(--dim); }

  /* 질문 */
  .q { display:block; padding:.5rem .6rem; border:1px solid var(--line); border-radius:6px;
       margin-bottom:.4rem; }
  .q.pending { border-color:var(--warn); }
  .q > .qp { display:block; font-size:.88rem; margin-bottom:.3rem; }
  .q .badge { float:right; font-size:.72rem; color:var(--warn); margin-left:.4rem; }
  /* 예/아니오 질문은 카드 전체가 체크박스의 라벨이다 */
  .q.tap { cursor:pointer; }
  .q.tap:not(.pending):hover { border-color:var(--dim); }   /* 미답 표시(주황 테두리)는 덮지 않는다 */
  .q.tap:has(input:checked) { border-color:currentColor; background:#8881; }

  /* 숫자 입력 — 최대치를 옆에 흐리게 적는다 (상황 질문은 [최대] 버튼도 단다) */
  .numf { display:inline-flex; gap:.3rem; align-items:center; }
  .numf .lim { color:var(--dim); font-size:.78rem; font-variant-numeric:tabular-nums; }
  .numf .lim[title] { cursor:help; }
  /* 명함으로 얹히는 특성 레벨(+3) — 상한과 달리 실제로 더해지는 값이라 흐리게 두지 않는다 */
  .numf .bon { color:CanvasText; }

  /* 다중 선택 — 고른 것이 한눈에 보이도록 칩으로 편다.
     상황 질문 위젯과 데미지 대상 고르기가 같은 모양을 쓴다. */
  .multi { display:flex; gap:.35rem; flex-wrap:wrap; }
  .chip { display:inline-flex; gap:.35rem; align-items:center; cursor:pointer;
          padding:.2rem .6rem; font-size:.85rem;
          border:1px solid var(--line); border-radius:999px; }
  .chip:hover { border-color:var(--dim); }
  .chip.on { border-color:currentColor; background:#8883; font-weight:600; }
</style>
</head>
<body>

<h1>원신 데미지 계산기 — Pyodide PoC</h1>
<div class="sub" style="margin-bottom:1rem">
  파이썬 엔진이 브라우저 안에서 그대로 돌아갑니다. 서버 없음.
  <b>+ 캐릭터 추가</b>로 파티를 편성하세요.
  파티원의 <b>빌드</b> 버튼으로 성유물·무기를 바꾸면 즉시 재계산되고, 질문에 답하면 새 질문이 드러납니다.
  데미지 표의 <b>히트를 누르면</b> 그 숫자가 왜 나왔는지 — 공식과 버프별 기여 — 를 펼쳐 봅니다.
</div>

<div id="status">초기화 중…</div>
<div id="errors"></div>

<div id="opts">
  <!-- 칩 하나하나가 이미 <label>이라 이쪽은 <label>이면 안 된다 —
       중첩되면 "데미지 대상" 글자를 눌렀을 때 첫 칩이 켜졌다 꺼진다. -->
  <span class="opt">데미지 대상 <span id="targets" class="multi"></span></span>
  <label>적 레벨 <input id="enemylv" type="number" value="100" min="1" max="200"></label>
  <button id="reset" disabled>답변 초기화</button>
</div>

<div class="cols">
  <!-- 왼쪽 칸은 파티와 상황 질문을 탭으로 겹쳐 쓴다. 둘 다 「입력」이고 오른쪽(스탯·데미지)이
       그 결과라, 세로로 늘어놓으면 결과가 화면 밖으로 밀린다. -->
  <div>
    <div class="tabs" role="tablist" aria-label="입력">
      <button type="button" id="tabbtn-party" role="tab" aria-controls="tab-party"
              aria-selected="true">파티 <span id="partycount" class="sub"></span></button>
      <button type="button" id="tabbtn-questions" role="tab" aria-controls="tab-questions"
              aria-selected="false">상황 질문 <span id="qcount" class="sub"></span></button>
    </div>

    <section id="tab-party" class="tabpanel scroll" role="tabpanel" aria-labelledby="tabbtn-party">
      <div id="party"></div>
    </section>

    <section id="tab-questions" class="tabpanel scroll" role="tabpanel"
             aria-labelledby="tabbtn-questions" hidden>
      <div id="qinfo" class="sub"></div>
      <div id="questions"></div>
    </section>
  </div>
  <div>
    <h2>스탯 시트</h2>
    <table id="stats"></table>
    <h2>데미지 <span id="dmgtarget" class="sub"></span></h2>
    <div style="max-height:55vh; overflow:auto"><div id="damage"></div></div>
  </div>
</div>

<dialog id="editor">
  <div class="dlg-hdr">
    <span id="editortitle"></span>
    <button id="editorclose">닫기</button>
  </div>
  <div id="editorbody"></div>
</dialog>

<dialog id="share">
  <div class="dlg-hdr">
    <span id="sharetitle"></span>
    <button id="shareclose">닫기</button>
  </div>
  <div id="sharebody">
    <div id="sharehint" class="sub"></div>
    <textarea id="sharetext" spellcheck="false" autocomplete="off"></textarea>
    <div id="sharemsg"></div>
    <div id="sharebtns">
      <button id="sharecopy">복사</button>
      <button id="shareapply">적용</button>
    </div>
  </div>
</dialog>

<dialog id="explain" class="wide">
  <div class="dlg-hdr">
    <span id="explaintitle"></span>
    <button id="explainclose">닫기</button>
  </div>
  <div id="explainbody"></div>
</dialog>
